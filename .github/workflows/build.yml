name: Build Audio Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-VST3
          path: build/AnalogFx_artefacts/Release/VST3/AnalogFx.vst3

  build_macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -G Xcode
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: macOS-VST3
          path: build/AnalogFx_artefacts/Release/VST3/AnalogFx.vst3
      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: macOS-AU
          path: build/AnalogFx_artefacts/Release/AU/AnalogFx.component

  build_linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev               libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev               libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev               libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-VST3
          path: build/AnalogFx_artefacts/VST3/AnalogFx.vst3

  create_release:
    name: Create Release
    needs: [build_windows, build_macos, build_linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnalogFx v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            Windows-VST3/*
            macOS-VST3/*
            macOS-AU/*
            Linux-VST3/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
